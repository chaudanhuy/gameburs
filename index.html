<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><title>Friend Buster</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Orbitron:wght@900&display=swap" rel="stylesheet">
<style>
:root{--bg:#05030f;--ink:#f4f7ff;--cy:#19f0ff;--vi:#8a4bff;--nv:#0b1440;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;color:var(--ink);font-family:'Chakra Petch',system-ui,sans-serif}
#w{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0}
canvas{position:absolute;inset:0;cursor:crosshair}
#ui{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.p{pointer-events:auto;text-align:center;background:rgba(8,10,40,.78);border:2px solid var(--vi);box-shadow:0 0 32px #8a4bff66,inset 0 0 24px #19f0ff22;border-radius:18px;padding:28px 44px;max-width:1000px;max-height:660px;overflow:auto;cursor:default}
h1{font:900 76px Orbitron,sans-serif;margin:0;letter-spacing:4px;color:#fff;text-shadow:0 0 18px var(--cy),0 0 44px var(--vi);line-height:.95}
h2{font:900 38px Orbitron,sans-serif;margin:0 0 14px;text-shadow:0 0 14px var(--cy)}
.sub{color:var(--cy);margin:12px 0 22px;font-size:20px}
button,select{font:700 20px 'Chakra Petch',sans-serif;color:var(--ink);background:#10164f;border:2px solid var(--cy);border-radius:10px;padding:10px 26px;margin:6px;cursor:pointer;box-shadow:0 0 12px #19f0ff44}
button:hover{background:var(--cy);color:#02040f;box-shadow:0 0 22px var(--cy)}
button.d{border-color:#ff4d79;box-shadow:0 0 12px #ff4d7944}button:focus-visible{outline:3px solid #fff}
.b{display:block;width:260px;margin:10px auto}
.g{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin:14px 0}
.c{width:170px;padding:12px;border:1px solid var(--vi);border-radius:14px;background:#0b1440aa}
.c img,.c canvas{width:120px;height:120px;border-radius:50%;border:3px solid var(--cy);box-shadow:0 0 14px var(--cy);object-fit:cover}
.c button{padding:5px 12px;font-size:15px;margin:3px}.c small{display:block;opacity:.7}
input[type=text]{font:500 20px 'Chakra Petch';padding:8px;border-radius:8px;border:2px solid var(--vi);background:#05030f;color:#fff;width:200px}
.r{display:flex;justify-content:space-between;gap:30px;padding:6px 14px;border-bottom:1px solid #8a4bff55;font-size:20px;min-width:520px;text-align:left}
.t{text-align:left;max-width:560px;line-height:1.6;font-size:18px}.st{font-size:24px;line-height:1.7}
.sk-panel{max-width:1100px;padding:22px 30px}.sk-grid{display:flex;flex-wrap:nowrap;gap:18px;justify-content:center;overflow-x:auto;padding:4px 0 10px}.sk-card{width:170px;flex-shrink:0;text-align:center;cursor:pointer;border:2px solid var(--vi);border-radius:16px;padding:10px 8px 12px;background:#0b1440cc;transition:transform .15s,border-color .15s,box-shadow .15s}.sk-card:hover{border-color:var(--cy);transform:scale(1.04);box-shadow:0 0 18px #19f0ff55}.sk-active{border-color:var(--cy)!important;box-shadow:0 0 28px #19f0ff99!important;transform:scale(1.06)!important}.sk-img-wrap{width:150px;height:300px;margin:0 auto;display:flex;align-items:flex-end;justify-content:center}.sk-img{max-width:150px;max-height:300px;object-fit:contain;object-position:bottom}.sk-name{margin-top:10px;font-size:15px;font-weight:700;color:var(--ink)}.sk-badge{font-size:13px;color:var(--cy);margin-top:4px;letter-spacing:1px}</style></head><body>

 how:()=>`<div class="p"><h2>HOW TO PLAY</h2><div class="t">🖱 Move the mouse to steer the rocket.<br>👆 Click (or hold) to fire.<br>💥 Hit friends for +100 (+150 PERFECT HIT if fast) × combo.<br>💨 A friend who escapes costs 1 ❤. Misses reset your combo.<br>☄ From level 4, don't shoot meteors — dodge them.<br>🎁 Catch power-ups: ⚡ Rapid, ⬤ Big, ▲ Multi, ◔ Slow, ☢ Nuke.<br>👑 Level 5: beat the Boss to win. <b>Esc</b> = pause.</div><button data-a="menu">BACK</button></div>`,
 set:()=>`<div class="p"><h2>SETTINGS</h2><button data-a="snd">🔊 SOUND: ${S.set.snd?'ON':'OFF'}</button><br><button data-a="mus">🎵 MUSIC: ${S.set.mus?'ON':'OFF'}</button><br><button class="d" data-a="wipe">DELETE ALL DATA</button><p style="opacity:.7;font-size:14px">Xóa toàn bộ ảnh, thống kê và cài đặt khỏi máy này.</p><button data-a="menu">BACK</button></div>`,
 skinsel:()=>{const n=SKINS.length;const cards=SKINS.map((s,i)=>{const active=i===CUR_SKIN;return `<div class="sk-card${active?' sk-active':''}" data-a="pickSkin" data-i="${i}"><div class="sk-img-wrap"><img src="${s.large}" alt="${s.name}" class="sk-img"></div><div class="sk-name">${s.name}</div>${active?'<div class="sk-badge">SELECTED</div>':''}</div>`;}).join('');return `<div class="p sk-panel"><h2>CHON NHAN VAT CUA BAN</h2><p class="sub" style="margin:4px 0 16px">Chon nhan vat roi bat dau hanh trinh!</p><div class="sk-grid">${cards}</div><button class="b" style="margin-top:18px" data-a="menu">VAO MENU</button></div>`;},
 shame:()=>{const k=SORT,v=f=>k==='rate'?((f.hit||0)/Math.max(1,(f.hit||0)+(f.dodged||0))*100):(f[k]||0),l=[...pool()].sort((a,b)=>v(b)-v(a));
  return`<div class="p"><h2>HALL OF SHAME</h2><div>${[['hit','Shot'],['dodged','Dodged'],['reward','Points'],['rate','Kill rate']].map(([a,b])=>`<button data-a="sort" data-i="${a}" ${a===k?'style="background:#19f0ff;color:#000"':''}>${b}</button>`).join('')}</div><div style="margin:10px 0">${l.map((f,i)=>`<div class="r"><span>${i+1}. ${f.img?'':f.emoji} ${esc(f.name)}</span><b>${k==='rate'?Math.round(v(f))+'%':v(f)}</b></div>`).join('')}</div><button data-a="menu">BACK</button></div>`}};
let SORT='hit';
function show(n){st=n==='play'?st:'menu';UI.innerHTML=SCR[n]()}
/* ===== Friend editor: crop, circle preview, optimized avatar ===== */
let ED=null;
function editor(f){ED={id:f&&f.id,im:null,z:1,ox:0,oy:0,name:f?f.name:''};
 UI.innerHTML=`<div class="p"><h2>${f?'EDIT FRIEND':'ADD FRIEND'}</h2><canvas id="ec" width="220" height="220" style="position:static;border-radius:50%;border:3px solid #19f0ff;cursor:default"></canvas><br><button data-a="pick">CHOOSE PHOTO</button><br>Name <input type="text" id="nm" maxlength="14" value="${esc(ED.name)}"><br>Zoom <input type="range" id="z" min="1" max="3" step=".05" value="1"> ← → <input type="range" id="ox" min="-1" max="1" step=".02" value="0"> ↑ ↓ <input type="range" id="oy" min="-1" max="1" step=".02" value="0"><br><button data-a="saveF">SAVE</button><button data-a="friends">CANCEL</button><p style="opacity:.7;font-size:14px">JPG, PNG, WEBP • Kéo thanh để crop thủ công</p></div>`;
 ['z','ox','oy'].forEach(k=>$('#'+k).oninput=e=>{ED[k]=+e.target.value;drawEd()});
 if(f&&f.img){ED.im=new Image();ED.im.onload=drawEd;ED.im.src=f.img}else drawEd()}
function cropTo(c,s){const i=ED.im,w=i.naturalWidth,h=i.naturalHeight,side=Math.min(w,h)/ED.z,sx=(w-side)/2*(1+ED.ox),sy=(h-side)/2*(1+ED.oy);c.drawImage(i,sx,sy,side,side,0,0,s,s)}
function drawEd(){const c=$('#ec').getContext('2d');c.clearRect(0,0,220,220);c.fillStyle='#0b1440';c.fillRect(0,0,220,220);if(ED.im)cropTo(c,220)}
async function onFile(file){if(!file)return;const url=URL.createObjectURL(file),im=new Image();im.onload=async()=>{ED.im=im;ED.z=1.4;ED.ox=ED.oy=0;
  try{if('FaceDetector' in window){const[b]=await new FaceDetector().detect(im);if(b){const w=im.naturalWidth,h=im.naturalHeight,side=Math.min(w,h)/ED.z;ED.ox=cl((b.boundingBox.x+b.boundingBox.width/2-w/2)/Math.max(1,(w-side)/2),-1,1);ED.oy=cl((b.boundingBox.y+b.boundingBox.height/2-h/2)/Math.max(1,(h-side)/2),-1,1)}}}catch(e){}
  $('#z').value=ED.z;$('#ox').value=ED.ox;$('#oy').value=ED.oy;drawEd()};im.src=url}
function saveFriend(){if(!ED.im){alert('Hãy chọn ảnh trước.');return}const c=document.createElement('canvas');c.width=c.height=192;cropTo(c.getContext('2d'),192);const data=c.toDataURL('image/webp',.85),name=($('#nm').value.trim()||'Bạn mới').slice(0,14);
 if(ED.id){const f=S.friends.find(f=>f.id===ED.id);f.img=data;f.name=name;delete IMG[f.id]}else S.friends.push({id:'f'+Date.now(),name,img:data,reward:0,hit:0,dodged:0});
 save();show('friends')}
/* ===== Input ===== */
const wr=$('#w');function fit(){const s=Math.min(innerWidth/W,innerHeight/H);wr.style.transform=`scale(${s})`;wr.style.left=(innerWidth-W*s)/2+'px';wr.style.top=(innerHeight-H*s)/2+'px'}
addEventListener('resize',fit);fit();
const pos=e=>{const r=wr.getBoundingClientRect();mx=(e.clientX-r.left)/(r.width/W)};
addEventListener('pointermove',pos);
$('#c').addEventListener('pointerdown',e=>{au();pos(e);down=true});addEventListener('pointerup',()=>down=false);
addEventListener('keydown',e=>{if(e.key==='Escape'&&(st==='play'||st==='pause')){if(st==='play'){st='pause';UI.innerHTML='<div class="p"><h2>PAUSED</h2><button data-a="resume">RESUME</button><button data-a="menu">MAIN MENU</button></div>'}else{st='play';UI.innerHTML=''}}});
$('#fi').onchange=e=>{onFile(e.target.files[0]);e.target.value=''};
UI.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;au();SFX.click();const a=b.dataset.a,i=b.dataset.i;
 if(a==='play')newGame();
  else if(a==='pickSkin'){CUR_SKIN=+i;show('skinsel')}
 else if(a==='resume'){st='play';UI.innerHTML=''}
 else if(a==='menu'){if(G&&st!=='menu')save();st='menu';show('menu')}
 else if(['friends','how','set','shame','skinsel'].includes(a))show(a);
 else if(a==='add')editor();
 else if(a==='edit')editor(S.friends.find(f=>f.id===i));
 else if(a==='del'){if(confirm('Xóa bạn này?')){S.friends=S.friends.filter(f=>f.id!==i);delete IMG[i];save();show('friends')}}
 else if(a==='pick')$('#fi').click();
 else if(a==='saveF')saveFriend();
 else if(a==='snd'||a==='mus'){S.set[a]^=1;save();show('set')}
 else if(a==='wipe'){if(confirm('Xóa toàn bộ dữ liệu?')){wipe();show('set')}}
 else if(a==='sort'){SORT=i;show('shame')}});
load();G={lvl:0,combo:1,score:0,shots:0,hits:0,lives:5,pw:{},ban:0};P={x:W/2,y:H-70};en=[];ms=[];pt=[];rg=[];me=[];pu=[];fx=[];show('skinsel');requestAnimationFrame(loop);
</script></body></html>
